services:
  redis:
    image: redis:7-alpine
    container_name: redis-test
    ports:
      - "6381:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  mongo:
    image: mongo:7
    container_name: mongo-test
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE : root-test
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:   
  redis-data: